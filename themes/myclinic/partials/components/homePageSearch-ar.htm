<form class="row gy-2 search-form align-items-center flex-row-reverse" id="search-form">
    <div class="col-sm-12 col-12 col-lg px-1">
        <select class="form-select form-select-lg select-mc js-example-basic-multiple" id="location">
            {% for location in locations %}
            <option value={{location.id}}>{{location.name_ar}}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto d-none d-lg-block"><span>أو</span></div>

    <div class="col-sm-6 col-6 col-lg px-1">
        <select class="form-select form-select-lg select-mc js-example-basic-multiple" id="specialty" name="specialty">
            <option value="">التخصصات</option>
            {% for item in specialties %}
            <option value={{item.slug}}>{{item.name_ar}}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto d-none d-lg-block"><span>أو</span></div>
    <div class="col-sm-6 col-6 col-lg px-1">
        <select class="form-select form-select-lg select-mc js-example-basic-multiple" id="doctor" name="doctor">
            <option value=""> الطبيب</option>
            {% for item in doctors %}
            <option value={{item.id}}><span >
                {{item.designation_ar}}
            </span>{{item.name_ar}}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12 col-lg col-xl-auto text-center">
        <button class="btn btn-primary btn-mc-search mx-auto mt-3 mt-sm-auto flex-row-reverse" type="submit">
            <svg class="ms-3" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
                <ellipse cx="20" cy="19.6" rx="20" ry="19.6" fill="white" />
                <path d="M21.7727 14.3984L27.2 19.5984L21.7727 24.7984M27.048 19.5984H18.7148H12" stroke="#003868"
                    stroke-width="2" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
            </svg>ابحث </button>
    </div>
</form>

<script>


    document.getElementById('search-form').addEventListener('submit', function (e) {
        e.preventDefault();  // Prevent the default form submission

        // Get the user's input
        const specialty = document.getElementById('specialty').value;
        const doctor = document.getElementById('doctor').value;
        const location = document.getElementById('location').value;

        var detailPageURL = '';

        if (specialty && location && !doctor) {
            detailPageURL = `/ar/search-specialty/${location}/${specialty}`;

        } else {
            detailPageURL = (doctor) ? `/ar/doctor-detail/${doctor}` : (specialty) ? `/ar/search-specialty/${specialty}` : `/ar/location-doctors/${location}`;

        }
        // Determine the detail page URL based on the search type

        // Redirect to the appropriate detail page
        window.location.href = detailPageURL;
    });


    $(document).ready(function () {
        $('#specialty').change(function () {
            var countryId = $(this).val();
            if (countryId) {

                var location = document.getElementById('location').value;
                var doctor = document.getElementById('doctor').value;

                $.ajax({
                    url: '/specialty-doctors/' + countryId + '?location=' + location,
                    headers:{'language':'ar'},
                    type: 'GET',
                    dataType: 'json',
                    success: function (data) {
                        var statesSelect = $('#doctor');
                        statesSelect.empty();
                        if (data.doctors.length) {
                            statesSelect.append('<option value=""> الطبيب </option>');
                            $.each(data.doctors, function (key, state) {
                                var selected = (state.id == doctor) ? ' selected' : '';
                                statesSelect.append('<option value="' + state.id + '"' + selected + '>' + (state.designation_ar ? state.designation_ar : null) + " "+state.name_ar + '</option>');
                            });
                        } else {
                            statesSelect.append('<option value=""> الطبيب </option>');
                        }
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        // Handle errors
                        console.error('API request failed:', textStatus, errorThrown);
                    }
                });
            }

        });

        $('#location').change(function () {
            var countryId = $(this).val();
            var specialty = document.getElementById('specialty').value;
            var doctor = document.getElementById('doctor').value;


            $.ajax({
                url: '/location-specialties/' + countryId,
                headers:{'language':'ar'},
                type: 'GET',
                dataType: 'json',
                success: function (data) {
                    var statesSelect = $('#specialty');
                    var doctorSelect = $('#doctor');
                    var selectedSpecialtyDoctors = null;



                    statesSelect.empty();
                    if (data.specialties.length) {
                        statesSelect.append('<option value=""> التخصصات </option>');
                        $.each(data.specialties, function (key, state) {
                            var selected = (state.slug === specialty) ? ' selected' : '';
                            statesSelect.append('<option value="' + state.slug + '"' + selected + '>' + state.name_ar + '</option>');
                        });
                        $('#specialty').change();
                    } else {
                        statesSelect.append('<option value=""> التخصصات </option>');
                    }

                    if (!selectedSpecialtyDoctors) {
                        doctorSelect.empty();
                        doctorSelect.append('<option value=""> الطبيب </option>');
                        $.each(data.doctors, function (key, state) {
                            var selected = (state.id == doctor) ? ' selected' : '';
                            doctorSelect.append('<option value="' + state.id + '"' + selected + '>' +(state.designation_ar ? state.designation_ar : null) + " "+ state.name_ar + '</option>');
                        });
                    }
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    // Handle errors
                    console.error('API request failed:', textStatus, errorThrown);
                }
            });

        });
    });

</script>

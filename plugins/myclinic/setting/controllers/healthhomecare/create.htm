<!-- Add this script at the bottom of your HTML file -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var inputFields = document.querySelectorAll('textarea[maxlength], input[maxlength]');

        inputFields.forEach(function (input) {
            var counter = document.createElement('span');
            counter.className = 'word-limit-counter';
            updateCounter(input);

            input.addEventListener('input', function () {
                updateCounter(input);
            });

            input.parentNode.insertBefore(counter, input.nextSibling);

            function updateCounter(input) {
                var maxLength = parseInt(input.getAttribute('maxlength')) || 0;
                var currentLength = input.value.length;
                var remaining = maxLength - currentLength;
                counter.textContent = remaining + ' words remaining';
            }
        });
    });
</script>
